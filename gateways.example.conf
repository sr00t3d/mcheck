# Custom SMTP Gateways / Mail Relays to check with `mcheck.sh --check-gateways`
# One hostname or IPv4 per line (blank lines and # comments are ignored).
# Default config path: ~/.config/mcheck/gateways.conf
# Manage via CLI:
#   mcheck.sh --add-gateway mail01.example.com
#   mcheck.sh --remove-gateway mail01.example.com
#   mcheck.sh --list-gateways

# Example entries:
# relay01.example.com
# relay02.example.com
# 203.0.113.25
